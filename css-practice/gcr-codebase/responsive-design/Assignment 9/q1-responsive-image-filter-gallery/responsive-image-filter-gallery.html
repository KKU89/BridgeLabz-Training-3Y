<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishnakant Upmanyu - CSS Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Cybersecurity & Web Filter Gallery</h1>
        <p>Portfolio Showcase | Krishnakant Upmanyu</p>
    </header>
    <main>
        <div class="gallery-grid">
            <figure class="gallery-item"><img class="blur-filter" src="https://picsum.photos/300/200?random=1" alt="Blur Filter"><figcaption>Blur (NIDS Analysis)</figcaption></figure>
            <figure class="gallery-item"><img class="grayscale-filter" src="https://picsum.photos/300/200?random=2" alt="Grayscale Filter"><figcaption>Grayscale (Network Traffic)</figcaption></figure>
            <figure class="gallery-item"><img class="sepia-filter" src="https://picsum.photos/300/200?random=3" alt="Sepia Filter"><figcaption>Sepia (Legacy Logs)</figcaption></figure>
            <figure class="gallery-item"><img class="brightness-filter" src="https://picsum.photos/300/200?random=4" alt="Brightness Filter"><figcaption>Brightness (Smart Food App)</figcaption></figure>
            <figure class="gallery-item"><img class="contrast-filter" src="https://picsum.photos/300/200?random=5" alt="Contrast Filter"><figcaption>Contrast (Brute-Force Detection)</figcaption></figure>
            <figure class="gallery-item"><img class="hue-filter" src="https://picsum.photos/300/200?random=6" alt="Hue Rotate Filter"><figcaption>Hue Rotate (Security Dash)</figcaption></figure>
        </div>
    </main>
</body>
</html>
