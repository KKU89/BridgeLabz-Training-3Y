<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Transformations Showcase</h1>
    <div class="transform-container">
        <div class="box-wrapper">
            <div class="box box-rotate">Rotate</div>
            <p class="label">rotate(45deg)</p>
        </div>
        <div class="box-wrapper">
            <div class="box box-scale">Scale</div>
            <p class="label">scale(1.2)</p>
        </div>
        <div class="box-wrapper">
            <div class="box box-translate">Translate</div>
            <p class="label">translateY(-15px)</p>
        </div>
        <div class="box-wrapper">
            <div class="box box-skew">Skew</div>
            <p class="label">skewX(-15deg)</p>
        </div>
    </div>
</body>
</html>
