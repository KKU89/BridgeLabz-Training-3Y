<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="depth-title">Developer Profiles</h1>
    <div class="cards-wrapper">
        <div class="card shadow-light">
            <h3>Subtle Depth</h3>
            <p>Software Engineer</p>
            <p>Light box shadow with clean border definition.</p>
        </div>
        <div class="card shadow-medium">
            <h3>Medium Depth</h3>
            <p>Krishnakant Upmanyu</p>
            <p>Full-Stack Web Developer & Cybersecurity Analyst.</p>
        </div>
        <div class="card shadow-heavy">
            <h3>Heavy Depth</h3>
            <p>System Architect</p>
            <p>Elevated elevation shadow with high contrast lift.</p>
        </div>
    </div>
</body>
</html>
