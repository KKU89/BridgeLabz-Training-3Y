<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-wrapper">
        <div class="box box-1">
            <h3>Box 1</h3>
            <p>Width: 300px | Height: 200px</p>
        </div>
        <div class="box box-2">
            <h3>Box 2</h3>
            <p>Max-Width: 80% | Min-Height: 40vh</p>
            <p class="overflow-text">This box demonstrates overflow control when content exceeds constraints. Overflow is set to auto to provide clean scrolling capability.</p>
        </div>
        <div class="box box-3">
            <h3>Box 3</h3>
            <p>Width: 20em | Height: 15em</p>
        </div>
    </div>
</body>
</html>
