<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Sizing Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Box-Sizing Comparison</h1></header>
    <main class="compare-container">
        <div class="box content-box">
            <h3>content-box</h3>
            <p>Width: 200px + Padding 30px + Border 5px = Total 270px width.</p>
        </div>
        <div class="box border-box">
            <h3>border-box</h3>
            <p>Width: 200px includes Padding 30px + Border 5px = Exact 200px width.</p>
        </div>
    </main>
</body>
</html>
