<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Responsive Image Showcase</h1></header>
    <main class="grid-container">
        <figure class="img-card">
            <div class="img-wrapper"><img src="https://picsum.photos/300/200?random=1" alt="Showcase 1"><div class="overlay"></div></div>
            <figcaption>Showcase Item 1</figcaption>
        </figure>
        <figure class="img-card">
            <div class="img-wrapper"><img src="https://picsum.photos/300/200?random=2" alt="Showcase 2"><div class="overlay"></div></div>
            <figcaption>Showcase Item 2</figcaption>
        </figure>
        <figure class="img-card">
            <div class="img-wrapper"><img src="https://picsum.photos/300/200?random=3" alt="Showcase 3"><div class="overlay"></div></div>
            <figcaption>Showcase Item 3</figcaption>
        </figure>
        <figure class="img-card">
            <div class="img-wrapper"><img src="https://picsum.photos/300/200?random=4" alt="Showcase 4"><div class="overlay"></div></div>
            <figcaption>Showcase Item 4</figcaption>
        </figure>
        <figure class="img-card">
            <div class="img-wrapper"><img src="https://picsum.photos/300/200?random=5" alt="Showcase 5"><div class="overlay"></div></div>
            <figcaption>Showcase Item 5</figcaption>
        </figure>
        <figure class="img-card">
            <div class="img-wrapper"><img src="https://picsum.photos/300/200?random=6" alt="Showcase 6"><div class="overlay"></div></div>
            <figcaption>Showcase Item 6</figcaption>
        </figure>
    </main>
</body>
</html>
