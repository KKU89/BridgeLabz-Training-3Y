<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>CSS Pseudo-Classes Showcase</h1></header>
    <main class="demo-row">
        <div class="card">
            <a href="#" class="demo-link">Hover & Active Link</a>
            <p>:hover changes color, :active shrinks on click.</p>
        </div>
        <div class="card">
            <input type="text" class="demo-input" placeholder="Click to focus">
            <p>:focus highlights border and adds shadow glow.</p>
        </div>
        <div class="card">
            <ul class="demo-list">
                <li>Item 1 (:nth-child odd)</li>
                <li>Item 2 (:nth-child even)</li>
                <li>Item 3 (:nth-child odd)</li>
            </ul>
            <p>:nth-child applies zebra striping.</p>
        </div>
    </main>
</body>
</html>
