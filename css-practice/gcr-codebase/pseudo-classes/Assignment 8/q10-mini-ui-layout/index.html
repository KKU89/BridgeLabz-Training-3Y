<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Mini UI Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h2>Mini UI Workspace</h2>
    </header>

    <main class="ui-wrapper">
        <div class="main-card">
            <div class="profile-thumb">
                <img src="https://picsum.photos/100/100" alt="Avatar">
            </div>
            <form class="user-form">
                <div class="field">
                    <label>Username</label>
                    <input type="text" placeholder="Krishnakant Upmanyu">
                </div>
                <div class="field">
                    <label>Feedback</label>
                    <textarea rows="3" placeholder="Enter notes..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Form</button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 BridgeLabz Training. All rights reserved.</p>
    </footer>
</body>
</html>
