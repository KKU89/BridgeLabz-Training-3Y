<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-face front">
                <h3>Cybersecurity</h3>
                <img src="https://via.placeholder.com/150" alt="Card Icon">
            </div>
            <div class="card-face back">
                <h3>System Defense</h3>
                <p>Interactive vulnerability analysis & penetration testing concepts.</p>
            </div>
        </div>
    </div>
</body>
</html>
