<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="header">Dashboard Control Panel</header>
        <aside class="sidebar">
            <nav>
                <p>Overview</p>
                <p>Analytics</p>
                <p>Reports</p>
                <p>Settings</p>
            </nav>
        </aside>
        <main class="main-grid">
            <div class="card span-2">Box 1 (Featured Metrics - Span 2)</div>
            <div class="card">Box 2 (Traffic)</div>
            <div class="card">Box 3 (Sales)</div>
            <div class="card">Box 4 (System Logs)</div>
        </main>
    </div>
</body>
</html>
