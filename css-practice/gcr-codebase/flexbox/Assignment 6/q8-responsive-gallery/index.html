<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <figure class="gallery-item">
            <img src="https://picsum.photos/300/200?random=1" alt="Sample 1">
            <figcaption>Mountain View</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/300/200?random=2" alt="Sample 2">
            <figcaption>Ocean Breeze</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/300/200?random=3" alt="Sample 3">
            <figcaption>Forest Trail</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/300/200?random=4" alt="Sample 4">
            <figcaption>City Lights</figcaption>
        </figure>
    </div>
</body>
</html>
