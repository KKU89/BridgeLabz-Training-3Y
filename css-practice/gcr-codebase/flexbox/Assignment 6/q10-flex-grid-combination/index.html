<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox & Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">WebDev Platform</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Articles</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="grid-body">
        <article class="article">
            <h1 class="animated-title">Main Article Topic</h1>
            <div class="flex-boxes">
                <div class="fbox">Module 1</div>
                <div class="fbox">Module 2</div>
                <div class="fbox">Module 3</div>
            </div>
        </article>

        <aside class="sidebar">
            <h3>Sidebar Info</h3>
            <p>Related links and quick navigation menu.</p>
        </aside>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Integrated Systems. All rights reserved.</p>
    </footer>
</body>
</html>
