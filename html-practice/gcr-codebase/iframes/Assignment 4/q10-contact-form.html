<!-- Q10: Contact Form with Placeholders -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Support</h1>
    <form action="#" method="post">
        <p>
            <label for="contact-name">Full Name:</label>
            <input type="text" id="contact-name" name="fullname" placeholder="Enter your full name" required>
        </p>
        <p>
            <label for="contact-email">Email:</label>
            <input type="email" id="contact-email" name="email" placeholder="example@domain.com" required>
        </p>
        <p>
            <label for="contact-subject">Subject:</label>
            <input type="text" id="contact-subject" name="subject" placeholder="Enter inquiry subject" required>
        </p>
        <p>
            <label for="contact-msg">Message:</label><br>
            <textarea id="contact-msg" name="message" rows="5" cols="40" placeholder="Type your detailed message here..." required></textarea>
        </p>
        <p>
            <input type="submit" value="Send Message">
        </p>
    </form>
</body>
</html>
