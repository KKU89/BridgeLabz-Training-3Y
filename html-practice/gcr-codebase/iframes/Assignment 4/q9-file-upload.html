<!-- Q9: Restricted File Upload Form -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Form</title>
</head>
<body>
    <h1>Upload Profile Document</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <p>
            <label for="profile-img">Choose Image File:</label>
            <input type="file" id="profile-img" name="profile_image" accept=".jpg, .png" required>
        </p>
        <p>Allowed file formats: Only <strong>.jpg</strong> and <strong>.png</strong> files are accepted.</p>
        <p>
            <input type="submit" value="Upload File">
        </p>
    </form>
</body>
</html>
