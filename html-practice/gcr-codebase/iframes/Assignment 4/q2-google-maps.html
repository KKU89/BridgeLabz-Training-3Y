<!-- Q2: Google Maps Embed with loading="lazy" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Maps Embed</title>
</head>
<body>
    <h1>Location Map</h1>
    <!-- The loading="lazy" attribute defers loading the iframe until it is near the visible viewport, saving bandwidth and boosting initial load speed. -->
    <iframe title="City Location" width="600" height="450" loading="lazy" src="https://maps.google.com/maps?q=Mathura,Uttar%20Pradesh&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</body>
</html>
