<!-- Q12: HTML Entities Demonstration -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities Demonstration</title>
</head>
<body>
    <h1>HTML Reserved & Symbolic Entities</h1>
    <p>
        Less Than: &lt; <br>
        Greater Than: &gt; <br>
        Ampersand: &amp; <br>
        Double Quote: &quot; <br>
        Single Quote: &apos;
    </p>
    <p>
        Copyright: &copy; <br>
        Trademark: &trade; <br>
        Registered: &reg;
    </p>
</body>
</html>
