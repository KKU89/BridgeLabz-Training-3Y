<!-- Q7: Login Form with CSRF Token -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
    <h1>Account Login</h1>
    <form action="#" method="post">
        <!-- A CSRF (Cross-Site Request Forgery) token is a unique, secret, and unpredictable value generated by the server to ensure submitted requests originate from the authentic user and not an unauthorized third-party site. -->
        <input type="hidden" name="csrf_token" value="d9f8a3b2c1e74f65a8d901234bcdef56">
        <p>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </p>
        <p>
            <label for="login-pass">Password:</label>
            <input type="password" id="login-pass" name="password" required>
        </p>
        <p>
            <input type="submit" value="Log In">
        </p>
    </form>
</body>
</html>
