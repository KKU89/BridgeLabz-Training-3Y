<!-- Q16: URI Encoding Demonstration -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Demonstration</h1>
    <p>Raw URL Query: <code>https://example.com/search?query=HTML & CSS</code></p>
    <p>
        Encoded Link: 
        <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML &amp; CSS (Encoded)</a>
    </p>
</body>
</html>
