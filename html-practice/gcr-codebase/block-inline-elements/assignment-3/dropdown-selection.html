<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection</title>
</head>
<body>
    <h1>Location & Destination Preferences</h1>
    <form>
        <p>
            Country:
            <select name="country">
                <option value="india" selected>India</option>
                <option value="japan">Japan</option>
                <option value="germany">Germany</option>
            </select>
        </p>
        <p>
            State:
            <select name="state">
                <option value="up" selected>Uttar Pradesh</option>
                <option value="rajasthan">Rajasthan</option>
                <option value="himachal">Himachal Pradesh</option>
            </select>
        </p>
        <p>
            City:
            <select name="city">
                <option value="mathura" selected>Mathura</option>
                <option value="agra">Agra</option>
                <option value="varanasi">Varanasi</option>
            </select>
        </p>
        <p>
            Favorite Tourist Place:
            <select name="place">
                <option value="vrindavan" selected>Vrindavan Temples</option>
                <option value="taj">Taj Mahal</option>
                <option value="ghats">Ganga Ghats</option>
            </select>
        </p>
    </form>
    <p>Selected Summary: India &gt; Uttar Pradesh &gt; Mathura &gt; Vrindavan Temples.</p>
</body>
</html>
