<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
    <!-- Header with Name & Tagline -->
    <header class="bg-white py-4 shadow-sm text-center">
        <div class="container">
            <h1 class="fw-bold mb-1">Krishnakant Upmanyu</h1>
            <p class="text-secondary lead mb-0">Cybersecurity Specialist & Full-Stack Web Developer</p>
        </div>
    </header>

    <main class="container my-5 text-center">
        <!-- Profile Image with Utility Classes -->
        <div class="mb-4">
            <img src="https://picsum.photos/200/200?random=2" alt="Profile Picture" class="img-fluid rounded-circle shadow p-2 bg-white">
        </div>

        <!-- Action Buttons with Spacing Utilities -->
        <div class="mb-5">
            <a href="#contact" class="btn btn-primary btn-lg me-2 px-4 shadow-sm">Hire Me</a>
            <a href="#" class="btn btn-outline-secondary btn-lg px-4 shadow-sm">Download CV</a>
        </div>

        <!-- Contact Form using Container & Form Controls -->
        <section id="contact" class="row justify-content-center">
            <div class="col-md-6 bg-white p-5 rounded shadow-sm text-start">
                <h2 class="h4 fw-bold text-center mb-4">Get In Touch</h2>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="3" placeholder="Write your message..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-muted border-top">
        <p class="mb-0">&copy; 2026 Krishnakant Upmanyu</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
