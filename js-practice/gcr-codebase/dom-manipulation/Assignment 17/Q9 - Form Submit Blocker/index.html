<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Form Submit Blocker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Form Submit Blocker & Validator</h1>
            <p class="subtitle">Intercepts invalid form submission with <code>event.preventDefault()</code> and clears errors in real-time</p>
        </header>

        <section class="card">
            <!-- Success Notification Banner -->
            <div id="successBanner" class="success-banner hidden" role="alert" aria-live="polite">
                <span class="banner-icon">&#10004;</span>
                <div class="banner-content">
                    <h4>Form Submitted Successfully!</h4>
                    <p>All inputs passed client-side validation requirements.</p>
                </div>
            </div>

            <form id="authForm" novalidate>
                <!-- Name Field -->
                <div class="form-group" id="nameGroup">
                    <label for="nameInput">Full Name <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="nameInput" 
                        name="name" 
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >
                    <span class="inline-error" id="nameError" aria-live="polite"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group" id="emailGroup">
                    <label for="emailInput">Email Address <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="emailInput" 
                        name="email" 
                        placeholder="e.g. user@example.com (must contain @)"
                        autocomplete="email"
                    >
                    <span class="inline-error" id="emailError" aria-live="polite"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group" id="passwordGroup">
                    <label for="passwordInput">Password <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="password" 
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                    >
                    <span class="inline-error" id="passwordError" aria-live="polite"></span>
                </div>

                <!-- Submission Actions -->
                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Submit Form</button>
                    <button type="button" id="resetBtn" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </section>
    </div>

    <script src="form-validation.js"></script>
</body>
</html>
