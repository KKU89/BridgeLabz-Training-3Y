<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store - Product Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        #status {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: contain;
            padding: 20px;
            background: #fafafa;
        }

        .product-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-category {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            flex: 1;
        }

        .product-rating {
            font-size: 14px;
            color: #f59e0b;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 22px;
            font-weight: 700;
            color: #16a34a;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #dc2626;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>🛍️ Fake Store Products</h1>
    <p id="status">Loading products...</p>
    <div class="product-grid" id="productGrid">
        <div class="loading">⏳ Fetching products from API...</div>
    </div>

    <script>
        const API_URL = "https://fakestoreapi.com/products";

        function getStarRating(rate) {
            const fullStars = Math.floor(rate);
            const halfStar = rate % 1 >= 0.5 ? "⭐" : "";
            return "⭐".repeat(fullStars) + halfStar + ` (${rate})`;
        }

        function createProductCard(product) {
            return `
                <div class="product-card">
                    <img 
                        class="product-image" 
                        src="${product.image}" 
                        alt="${product.title}"
                        loading="lazy"
                    />
                    <div class="product-info">
                        <p class="product-category">${product.category}</p>
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-rating">${getStarRating(product.rating.rate)} (${product.rating.count} reviews)</p>
                        <p class="product-price">$${product.price.toFixed(2)}</p>
                    </div>
                </div>
            `;
        }

        async function loadProducts() {
            const grid = document.getElementById("productGrid");
            const status = document.getElementById("status");
            const startTime = Date.now();

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const products = await response.json();
                const elapsed = Date.now() - startTime;

                grid.innerHTML = products.map(createProductCard).join("");
                status.textContent = `✅ Loaded ${products.length} products in ${elapsed}ms`;
            } catch (error) {
                grid.innerHTML = `<div class="error">❌ Failed to load products: ${error.message}</div>`;
                status.textContent = "❌ Error fetching products";
                console.error("Fetch error:", error);
            }
        }

        loadProducts();
    </script>

</body>
</html>
