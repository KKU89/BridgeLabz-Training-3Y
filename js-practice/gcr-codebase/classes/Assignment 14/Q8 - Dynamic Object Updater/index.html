<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q8 · Dynamic Object Updater</title>
  <style>
    body { max-width: 680px; margin: 48px auto; padding: 0 20px; font: 16px Arial, sans-serif; color: #172033; background: #f3f6fb; }
    form, section { margin: 18px 0; padding: 24px; border: 1px solid #dce3ef; border-radius: 12px; background: white; }
    .field { margin: 16px 0; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #aeb8c8; border-radius: 6px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #3158c7; color: white; font: inherit; cursor: pointer; }
    pre { overflow: auto; padding: 16px; border-radius: 8px; background: #eef2f8; }
  </style>
  <script src="q8_dynamic_object_updater.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <p class="eyebrow">Question 8</p>
    <h1>Update User Details</h1>
    <form class="card form-card" id="user-form">
      <div class="field">
        <label for="user-name">Name</label>
        <input id="user-name" name="name" type="text" required>
      </div>
      <div class="field">
        <label for="user-email">Email</label>
        <input id="user-email" name="email" type="email" required>
      </div>
      <div class="field">
        <label for="user-age">Age</label>
        <input id="user-age" name="age" type="number" min="0" step="1" required>
      </div>
      <button type="submit">Save changes</button>
    </form>
    <section class="card">
      <h2>Updated user object</h2>
      <pre id="updated-user" aria-live="polite"></pre>
    </section>
    <nav class="back-link"><a href="index.html">← All questions</a></nav>
  </main>
</body>
</html>
