<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q3 · Library Management System</title>
  <style>
    body { max-width: 720px; margin: 48px auto; padding: 0 20px; font: 16px Arial, sans-serif; color: #172033; background: #f3f6fb; }
    section, form { margin: 18px 0; padding: 24px; border: 1px solid #dce3ef; border-radius: 12px; background: white; }
    .book-list { display: grid; gap: 12px; padding-left: 22px; }
    .book-list span { display: block; color: #637089; font-size: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #aeb8c8; border-radius: 6px; font: inherit; }
    button { margin-top: 14px; padding: 10px 16px; border: 0; border-radius: 6px; background: #3158c7; color: white; font: inherit; cursor: pointer; }
    .success { color: #117443; }
    .error-message { color: #bd2533; }
  </style>
  <script src="q3_library_management.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <p class="eyebrow">Question 3</p>
    <h1>Library Management</h1>
    <section class="card">
      <h2>Available books</h2>
      <ul id="available-books" class="book-list" aria-live="polite"></ul>
    </section>
    <form class="card form-card" id="issue-book-form">
      <h2>Issue a book</h2>
      <div class="field">
        <label for="book-isbn">Search by ISBN</label>
        <input id="book-isbn" name="isbn" type="text" inputmode="numeric" placeholder="For example: 9780547928227" required>
      </div>
      <button type="submit">Issue book</button>
      <p id="library-result" class="message" aria-live="polite"></p>
    </form>
    <nav class="back-link"><a href="index.html">← All questions</a></nav>
  </main>
</body>
</html>
